apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-seed-dhilabs
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-seed-dhilabs
    spec:
      containers:
        - name: seed
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-db-credentials
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for LiteLLM_TeamTable to be created by migrations..."
              until psql -h litellm-postgresql -U litellm -d litellm -c "SELECT 1 FROM \"LiteLLM_TeamTable\" LIMIT 1;" >/dev/null 2>&1; do
                sleep 2
              done
              echo "Ensuring Dhilabs team is registered..."
              psql -h litellm-postgresql -U litellm -d litellm << 'EOF'
              INSERT INTO "LiteLLM_TeamTable" (team_id, team_alias, organization_id, max_budget, models, blocked, spend, created_at, updated_at)
              VALUES ('a95ff5c6-7168-4ab5-8b73-4a23de86987f', 'Dhilabs', NULL, 1000.0, ARRAY['mock-model', 'gpt-4o', 'gemini-1.5-pro'], false, 0.0, NOW(), NOW())
              ON CONFLICT (team_id) DO UPDATE SET organization_id = NULL;
              EOF
              echo "Dhilabs team successfully verified and ensured."
      restartPolicy: OnFailure
