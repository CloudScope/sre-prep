apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    app.kubernetes.io/name: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        # 1. Main Spring Boot Application Container
        - name: payment-api
          image: smartlizzard/payment-api:sha-f6de154
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: payment-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=demo,deployment.environment.name=lab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-opentelemetry-collector.monitoring.svc:4318/v1/traces
            - name: SYNTHETIC_AUTH_USER
              value: synthetic-monitor
            - name: SYNTHETIC_AUTH_PASSWORD
              value: synthetic-secret-password-123
            # Chaos knobs for incident drills
            - name: ERROR_RATE
              value: "0.0"
            - name: EXTRA_LATENCY_MS
              value: "0"
          # Startup probe gives JVM/Spring Boot up to 90s to complete cold start
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "wget -qO- http://127.0.0.1:8081/actuator/health/liveness | grep -q 'UP' || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "wget -qO- http://127.0.0.1:8081/actuator/health/readiness | grep -q 'UP' || exit 1"
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "wget -qO- http://127.0.0.1:8081/actuator/health/liveness | grep -q 'UP' || exit 1"
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # 2. Telemetry Sidecar (Scrapes Actuator over loopback and pushes to OTel Collector)
        - name: otel-sidecar
          image: otel/opentelemetry-collector-contrib:0.163.2
          args: ["--config=/etc/otelcol/config.yaml"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: otel-sidecar-config
              mountPath: /etc/otelcol

      volumes:
        - name: otel-sidecar-config
          configMap:
            name: payment-api-sidecar-config
