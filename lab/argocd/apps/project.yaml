# Limits lab apps to these sources and the demo namespace, so a bad manifest
# can't deploy somewhere else or create cluster-scoped objects (except its Namespace).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sre-lab
  namespace: argocd
  annotations:
    # Create the project before the Applications that reference it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: SRE prep lab workloads
  sourceRepos:
    - https://github.com/CloudScope/sre-prep.git
    - https://stefanprodan.github.io/podinfo
  destinations:
    - server: https://kubernetes.default.svc
      namespace: demo
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
