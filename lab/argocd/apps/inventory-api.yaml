apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-api
  namespace: argocd
spec:
  project: sre-lab
  source:
    repoURL: https://github.com/CloudScope/sre-prep.git
    targetRevision: main
    path: lab/apps/inventory-api
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true      # delete objects removed from Git
      selfHeal: true   # revert manual changes (kubectl edit/scale/set env)
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
