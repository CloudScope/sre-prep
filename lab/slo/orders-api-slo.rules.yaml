# Prometheus rules for the orders-api SLOs. Documented in docs/slo.md.
#
# SLIs (good events / valid events, on GET /orders/{order_id}):
#   availability: requests that did not return 5xx
#   latency:      requests served in <= 250ms (le="0.25" bucket)
# SLOs (30-day rolling): availability 99.5%, latency 99%.
#
# Alerting follows the SRE Workbook multi-window, multi-burn-rate table
# (https://sre.google/workbook/alerting-on-slos/):
#   page:   14.4x burn over 1h AND 5m   (2% of 30d budget spent in 1h)
#           6x    burn over 6h AND 30m  (5% of budget spent in 6h)
#   ticket: 1x    burn over 3d AND 6h   (10% of budget spent in 3d)
groups:
  - name: orders-api-slo-objectives
    rules:
      - record: slo:objective:ratio
        expr: vector(0.995)
        labels:
          service: orders-api
          slo: availability
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels:
          service: orders-api
          slo: latency
      - record: slo:error_budget:ratio
        expr: 1 - slo:objective:ratio

  - name: orders-api-slo-sli
    interval: 30s
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}",http_response_status_code=~"5.."}[5m])) or vector(0))
          /
          sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[5m]))
        labels:
          service: orders-api
          slo: availability
      - record: slo:sli_error:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{exported_job="demo/orders-api",http_route="/orders/{order_id}",le="0.25"}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[5m]))
          )
        labels:
          service: orders-api
          slo: latency
      - record: slo:sli_error:ratio_rate30m
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}",http_response_status_code=~"5.."}[30m])) or vector(0))
          /
          sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[30m]))
        labels:
          service: orders-api
          slo: availability
      - record: slo:sli_error:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{exported_job="demo/orders-api",http_route="/orders/{order_id}",le="0.25"}[30m]))
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[30m]))
          )
        labels:
          service: orders-api
          slo: latency
      - record: slo:sli_error:ratio_rate1h
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}",http_response_status_code=~"5.."}[1h])) or vector(0))
          /
          sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[1h]))
        labels:
          service: orders-api
          slo: availability
      - record: slo:sli_error:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{exported_job="demo/orders-api",http_route="/orders/{order_id}",le="0.25"}[1h]))
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[1h]))
          )
        labels:
          service: orders-api
          slo: latency
      - record: slo:sli_error:ratio_rate6h
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}",http_response_status_code=~"5.."}[6h])) or vector(0))
          /
          sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[6h]))
        labels:
          service: orders-api
          slo: availability
      - record: slo:sli_error:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{exported_job="demo/orders-api",http_route="/orders/{order_id}",le="0.25"}[6h]))
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[6h]))
          )
        labels:
          service: orders-api
          slo: latency
      - record: slo:sli_error:ratio_rate3d
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}",http_response_status_code=~"5.."}[3d])) or vector(0))
          /
          sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[3d]))
        labels:
          service: orders-api
          slo: availability
      - record: slo:sli_error:ratio_rate3d
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{exported_job="demo/orders-api",http_route="/orders/{order_id}",le="0.25"}[3d]))
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[3d]))
          )
        labels:
          service: orders-api
          slo: latency

  # 30d windows over raw series are expensive, so evaluate less often.
  # Needs Prometheus retention >= 30d (see lab/helm/kube-prometheus-stack-values.yaml).
  - name: orders-api-slo-budget
    interval: 5m
    rules:
      - record: slo:sli_error:ratio_rate30d
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}",http_response_status_code=~"5.."}[30d])) or vector(0))
          /
          sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[30d]))
        labels:
          service: orders-api
          slo: availability
      - record: slo:sli_error:ratio_rate30d
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{exported_job="demo/orders-api",http_route="/orders/{order_id}",le="0.25"}[30d]))
            /
            sum(rate(http_server_request_duration_seconds_count{exported_job="demo/orders-api",http_route="/orders/{order_id}"}[30d]))
          )
        labels:
          service: orders-api
          slo: latency
      # 1 = full budget left, 0 = exhausted, negative = SLO violated.
      - record: slo:error_budget_remaining:ratio
        expr: 1 - (slo:sli_error:ratio_rate30d / slo:error_budget:ratio)

  - name: orders-api-slo-alerts
    rules:
      - alert: SLOErrorBudgetBurnPage
        expr: |
          (
              slo:sli_error:ratio_rate1h > (14.4 * slo:error_budget:ratio)
            and
              slo:sli_error:ratio_rate5m > (14.4 * slo:error_budget:ratio)
          )
          or
          (
              slo:sli_error:ratio_rate6h > (6 * slo:error_budget:ratio)
            and
              slo:sli_error:ratio_rate30m > (6 * slo:error_budget:ratio)
          )
        labels:
          severity: critical
          notify: page
        annotations:
          summary: "{{ $labels.service }} is burning its {{ $labels.slo }} error budget fast"
          description: "At this rate the 30-day {{ $labels.slo }} error budget for {{ $labels.service }} runs out in days, not weeks. Check recent deploys and the error/latency panels."
          runbook_url: "docs/runbooks/orders-api-slo-burn.md"
      - alert: SLOErrorBudgetBurnTicket
        expr: |
          (
              slo:sli_error:ratio_rate3d > (1 * slo:error_budget:ratio)
            and
              slo:sli_error:ratio_rate6h > (1 * slo:error_budget:ratio)
          )
        labels:
          severity: warning
          notify: ticket
        annotations:
          summary: "{{ $labels.service }} is slowly burning its {{ $labels.slo }} error budget"
          description: "{{ $labels.service }} has spent its {{ $labels.slo }} error budget faster than sustainable over the last 3 days. Investigate during working hours."
          runbook_url: "docs/runbooks/orders-api-slo-burn.md"
