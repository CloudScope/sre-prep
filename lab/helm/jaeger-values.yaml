# Chart: jaegertracing/jaeger 4.13.1 (Jaeger v2.20.0, built on the OTel Collector)
# Pinned below 2.21 for Grafana compatibility; see lab/argocd/apps/jaeger.yaml.
# Single all-in-one pod: OTLP receiver + in-memory storage + query UI.
# In-memory means traces are lost on restart; fine for a lab, not for production
# (use Elasticsearch/OpenSearch/Cassandra/Badger there).

jaeger:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Full Jaeger v2 config (replaces the built-in default).
userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: memstore
    jaeger_storage:
      backends:
        memstore:
          memory:
            # Oldest traces are evicted past this. ~2 spans per orders-api request,
            # so roughly 1-2 hours of lab traffic within the 512Mi limit.
            max_traces: 20000

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: memstore
