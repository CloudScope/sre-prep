# Chart: oci://ghcr.io/berriai/litellm-helm
# Stateless deployment of LiteLLM Proxy on Kubernetes

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: "main-v1.61.1"
  pullPolicy: IfNotPresent

# Customize container entrypoint to set Dhilabs as the default organization branding in the UI
command: ["/bin/sh", "-c"]
args:
  - |
    sed -i 's/Default Organization/Dhilabs/g' /app/ui/litellm-dashboard/out/_next/static/chunks/app/*.js 2>/dev/null || true
    exec /usr/bin/litellm --config /etc/litellm/config.yaml

# Stateful Mode: Connect to dedicated PostgreSQL database for UI, virtual keys, and spend tracking
db:
  deployStandalone: false
  useExisting: true
  endpoint: "litellm-postgresql.litellm.svc:5432"
  database: litellm
  secret:
    name: litellm-db-credentials
    usernameKey: username
    passwordKey: password

postgresql:
  enabled: false

# Enable Prisma DB migration job to automatically initialize LiteLLM tables
migrationJob:
  enabled: true

# Master API key for proxy administration and client access in lab
masterkey: "sk-litellm-master-key-lab"

# Service configuration
service:
  type: ClusterIP
  port: 4000

# Proxy Configuration (dynamically rendered as config.yaml in a ConfigMap)
proxy_config:
  general_settings:
    master_key: "os.environ/PROXY_MASTER_KEY"
  model_list:
    # 1. Mock model for zero-cost lab verification and SLO/chaos drills
    - model_name: mock-model
      litellm_params:
        model: openai/fake
        api_key: "fake-mock-key"
        mock_response: "Hello from LiteLLM stateless proxy in local-k8s cluster!"
    # 2. Production model routes (keys injected via secret or env vars)
    - model_name: gpt-4o
      litellm_params:
        model: openai/gpt-4o
        api_key: os.environ/OPENAI_API_KEY
    - model_name: gemini-1.5-pro
      litellm_params:
        model: gemini/gemini-1.5-pro
        api_key: os.environ/GEMINI_API_KEY
  litellm_settings:
    drop_params: true
    callbacks:
      - otel

# Observability: ServiceMonitor (LiteLLM requires enterprise license for /metrics callback; OTel tracing enabled below)
serviceMonitor:
  enabled: false
  interval: 15s
  labels:
    release: monitoring  # Matches kube-prometheus-stack serviceMonitorSelector

# OpenTelemetry distributed tracing and extra environment variables
extraEnvVars:
  - name: OPENAI_API_KEY
    value: "sk-dummy-openai-key-for-lab"
  - name: GEMINI_API_KEY
    value: "dummy-gemini-key-for-lab"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-opentelemetry-collector.monitoring.svc:4318"
  - name: OTEL_SERVICE_NAME
    value: "litellm-proxy"

# Sized for laptop kind cluster
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Health check probes
livenessProbe:
  path: /health/liveliness
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  path: /health/readiness
  initialDelaySeconds: 15
  periodSeconds: 5

