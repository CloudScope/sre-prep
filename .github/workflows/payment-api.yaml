name: Payment API Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'lab/apps/payment-api/**'
      - '.github/workflows/payment-api.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'lab/apps/payment-api/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_meta.outputs.tag }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and run test suite
        working-directory: lab/apps/payment-api
        run: mvn clean test -B

      - name: Determine image tag
        id: image_meta
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USR }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: lab/apps/payment-api
          file: lab/apps/payment-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ vars.DOCKER_HUB_USR }}/payment-api:${{ steps.image_meta.outputs.tag }}
            ${{ vars.DOCKER_HUB_USR }}/payment-api:latest

  gitops-deploy:
    name: GitOps Deployment Sync
    needs: build-and-package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update deployment manifest tag
        run: |
          NEW_TAG="${{ needs.build-and-package.outputs.image_tag }}"
          DOCKER_USER="${{ vars.DOCKER_HUB_USR }}"
          DEPLOYMENT_FILE="lab/apps/payment-api/k8s/deployment.yaml"
          
          # Replace payment-api image with the newly built Docker Hub tag
          sed -i.bak -E "s|(image:\s*).*payment-api:.*|\1${DOCKER_USER}/payment-api:${NEW_TAG}|" "$DEPLOYMENT_FILE"
          rm -f "${DEPLOYMENT_FILE}.bak"

      - name: Commit manifest changes for Argo CD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lab/apps/payment-api/k8s/deployment.yaml

          if ! git diff-index --quiet HEAD; then
            git commit -m "deploy(payment-api): bump image to ${{ needs.build-and-package.outputs.image_tag }} [skip ci]"
            git push origin main
          fi
